<style>
/* Layout: one phone-width column, like a mixtape case; one screen per step, the cassette side labels A/B carry through to the reel. Single dark theme by choice (night drive). */
:root {
  --ink: #1a1430;
  --surface: #261e42;
  --surface-2: #322858;
  --line: #43386d;
  --text: #f7f2ff;
  --muted: #b9afd6;
  --heart: #ff4d6d;
  --butter: #ffd166;
  --lilac: #b9a7ff;
  --label: #fbf3e4;
  --label-ink: #2a2140;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Caveat", "Bradley Hand", cursive;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }

.app {
  max-width: 460px;
  min-height: 100%;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 14px; height: 14px; background: var(--heart); border-radius: 3px 50% 50% 50%; transform: rotate(45deg); display: inline-block; }
.back { background: none; border: 0; color: var(--muted); padding: 8px 4px; font-size: 15px; }
.progress { height: 6px; background: var(--surface); border-radius: 99px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--heart); border-radius: 99px; transition: width .35s ease; }

main { flex: 1; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1, h2 { font-family: var(--f-display); font-weight: 800; line-height: 1.05; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(38px, 11vw, 52px); letter-spacing: -.02em; }
h2 { font-size: clamp(27px, 7.4vw, 34px); letter-spacing: -.01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--butter); }

.btn {
  min-height: 56px; border-radius: 16px; border: 0; padding: 14px 20px;
  background: var(--heart); color: #fff; font-weight: 700; font-size: 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  transition: transform .12s ease, filter .12s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.btn.small { min-height: 44px; font-size: 15px; padding: 8px 14px; width: auto; border-radius: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Start: CSS cassette */
.tape {
  background: var(--surface-2); border-radius: 18px; padding: 16px; position: relative;
  box-shadow: inset 0 0 0 2px var(--line);
}
.tape-label { background: var(--label); color: var(--label-ink); border-radius: 10px; padding: 12px 14px 14px; }
.tape-label .hand { font-family: var(--f-hand); font-size: 30px; line-height: 1; }
.tape-label .sub { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-top: 4px; display: flex; justify-content: space-between; }
.reels { display: flex; justify-content: center; gap: 70px; margin: 14px 0 2px; }
.reel { width: 54px; height: 54px; border-radius: 50%; background: var(--ink); border: 6px solid var(--label); position: relative; animation: spin 4s linear infinite; }
.reel::before, .reel::after { content: ""; position: absolute; inset: 50% auto auto 50%; width: 30px; height: 4px; margin: -2px 0 0 -15px; background: var(--label); border-radius: 2px; }
.reel::after { transform: rotate(60deg); }
@keyframes spin { to { transform: rotate(360deg); } }
.sample { font-size: 14px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-top: 12px; }
.sample b { font-family: var(--f-mono); font-weight: 500; color: var(--butter); font-size: 12.5px; padding-top: 2px; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; }
.facts span { font-size: 14px; padding: 6px 10px; border-radius: 99px; background: var(--surface); color: var(--muted); }

/* Quiz */
.qnum { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.options { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  min-height: 64px; padding: 12px 16px; border-radius: 16px;
  background: var(--surface); border: 2px solid transparent; transition: border-color .15s, background .15s, transform .12s;
}
.opt:active { transform: scale(.985); }
.opt .key { font-family: var(--f-mono); font-size: 13px; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--butter); flex: none; }
.opt .t { font-weight: 700; font-size: 18px; display: block; }
.opt .s { color: var(--muted); font-size: 14.5px; display: block; }
.opt[aria-pressed="true"] { border-color: var(--heart); background: var(--surface-2); }
.opt[aria-pressed="true"] .key { background: var(--heart); color: #fff; }

.yearbox { background: var(--surface); border-radius: 20px; padding: 22px 18px; display: flex; flex-direction: column; gap: 16px; align-items: stretch; }
.yearline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bigyear { font-family: var(--f-display); font-weight: 800; font-size: 76px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.round { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font-size: 26px; display: grid; place-items: center; flex: none; }
input[type=range] { width: 100%; accent-color: var(--heart); height: 32px; }
.window { font-size: 15.5px; color: var(--muted); text-align: center; }
.window b { color: var(--butter); font-weight: 700; }

.textin { width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 18px; }
.textin:focus { border-color: var(--heart); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-size: 15px; min-height: 40px; }
.chip:hover { border-color: var(--lilac); }

/* Songs */
.songs { display: flex; flex-direction: column; gap: 10px; }
.side { font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.song { background: var(--surface); border-radius: 16px; padding: 12px 12px 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; }
.song .no { font-family: var(--f-mono); font-size: 13px; color: var(--butter); padding-top: 3px; }
.song .info { min-width: 0; }
.song .title { font-weight: 700; font-size: 17.5px; line-height: 1.25; overflow-wrap: anywhere; }
.song .meta { font-size: 14.5px; color: var(--muted); }
.song .why { font-size: 14.5px; color: var(--lilac); margin-top: 2px; }
.song .moves { display: flex; flex-direction: column; gap: 4px; }
.icon { width: 36px; height: 32px; border-radius: 9px; background: var(--surface-2); border: 0; color: var(--muted); display: grid; place-items: center; font-size: 15px; }
.icon:disabled { opacity: .3; cursor: default; }
.song .acts { grid-column: 2 / 4; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.pill { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 6px 12px; font-size: 14px; min-height: 36px; color: var(--text); }
.pill.on { background: var(--surface-2); border-color: var(--lilac); }
.swap { grid-column: 1 / 4; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
.alt { text-align: left; background: var(--surface-2); border: 0; border-radius: 12px; padding: 10px 12px; min-height: 48px; }
.alt small { color: var(--muted); display: block; font-size: 13.5px; }
.own { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
.own input { min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink); font-size: 15px; }
@media (max-width: 380px) { .own { grid-template-columns: 1fr; } }

/* Photos */
.drop { border: 2px dashed var(--line); border-radius: 18px; padding: 22px 16px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; background: var(--surface); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.thumb { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(26,20,48,.8); color: #fff; font-size: 15px; }
.note { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.note::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--lilac); }

/* Reel */
.stage { position: relative; align-self: center; width: 100%; max-width: min(100%, calc(62vh * 9 / 16)); aspect-ratio: 9 / 16; border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--line); }
.stage canvas { width: 100%; height: 100%; display: block; }
.playbtn { position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%; border: 0; background: rgba(255,77,109,.92); color: #fff; font-size: 30px; display: grid; place-items: center; padding-left: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface); padding: 5px; border-radius: 14px; }
.seg button { border: 0; background: transparent; border-radius: 10px; min-height: 42px; font-size: 15px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 700; box-shadow: inset 0 0 0 1px var(--lilac); }
.ctrl { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--muted); }
.toggle input { width: 20px; height: 20px; accent-color: var(--heart); }

/* Sheet + toast */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,7,22,.66); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--surface); width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 22px max(18px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.sheet pre { margin: 0; background: var(--ink); border-radius: 12px; padding: 12px; font-family: var(--f-mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--label); }
.why-box { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; color: var(--muted); }
.why-box b { color: var(--text); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--label); color: var(--label-ink); padding: 12px 16px; border-radius: 14px; font-size: 15px; width: max-content; max-width: calc(100% - 32px); z-index: 30; box-shadow: 0 8px 30px rgba(0,0,0,.35); }

.fade { animation: in .28s ease both; }
@keyframes in { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade, .reel { animation: none; } .progress span { transition: none; } }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

// ---------- Matching ----------
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function score(s) {
  const G = S.a.genres.length ? S.a.genres : ["pop", "hiphop", "rock", "electro", "deutsch"];
  const et = { dance: .9, kitchen: .55, dj: .8, bed: .3 }[S.a.party] ?? .7;
  return (s.g.some(g => G.includes(g)) ? 3 : 0) + (s.m === S.a.heart ? 2 : 0) + 2 * (1 - Math.abs(s.e - et)) + hash(s.t + S.a.year) * .9;
}
function choose(pool, n, taken) {
  const sorted = pool.filter(s => !taken.has(s.id)).sort((x, y) => score(y) - score(x));
  const out = [], perYear = {};
  for (const s of sorted) {
    if (out.length >= n) break;
    if ((perYear[s.y] || 0) >= 2) continue;
    out.push(s); perYear[s.y] = (perYear[s.y] || 0) + 1; taken.add(s.id);
  }
  return out;
}
function finishQuiz() {
  const [a, b] = youth();
  let pad = 0, thenPool = [];
  do { thenPool = DB.filter(s => s.y >= a - pad && s.y <= b + pad); pad += 2; } while (thenPool.length < 12 && pad < 20);
  const nowPool = DB.filter(s => s.y >= NOW_FROM);
  const guilty = parseOwn(S.a.guilty);
  const slots = guilty ? 5 : 6;
  let nThen = { then: slots, now: 0, both: Math.ceil(slots / 2) }[S.a.mix || "both"];
  const taken = new Set();
  if (guilty && guilty.id) taken.add(guilty.id);
  const thenPick = choose(thenPool, nThen, taken);
  const nowPick = choose(nowPool, slots - thenPick.length, taken);
  const list = [...thenPick.sort((x, y) => x.y - y.y), ...nowPick.sort((x, y) => x.y - y.y)];
  if (guilty) list.push({ ...guilty, guilty: true });
  S.songs = list.map(s => ({ ...s, side: s.y && s.y >= NOW_FROM && !(S.a.mix === "then") ? "now" : "then" }));
  if (guilty) S.songs[S.songs.length - 1].side = "guilty";
  S.style = { tape: "tape", mp3: "polaroid", yt: "polaroid", tiktok: "neon" }[S.a.device] || "tape";
  S.open = -1;
  S.screen = "songs"; render();
}
function parseOwn(txt) {
  if (!txt) return null;
  const [t, a] = txt.split(/\s+[–—-]\s+/);
  const hit = DB.find(s => s.t.toLowerCase() === t.trim().toLowerCase());
  if (hit) return { ...hit };
  return { id: "own-" + hash(txt), t: t.trim(), a: (a || "").trim(), y: null, g: [], e: .7, m: "love", own: true };
}
function alternatives(i) {
  const cur = S.songs[i];
  const ids = new Set(S.songs.map(s => s.id));
  let pool;
  if (cur.side === "now") pool = DB.filter(s => s.y >= NOW_FROM);
  else { const [a, b] = youth(); pool = DB.filter(s => s.y >= a - 3 && s.y <= b + 3); }
  return pool.filter(s => !ids.has(s.id)).sort((x, y) => score(y) - score(x)).slice(0, 3);
}
function reason(s) {
  if (s.guilty) return "Dein Guilty Pleasure. Bleibt unter uns.";
  if (s.own) return "Von dir eingetragen.";
  const heartLine = { love: "Passt zum Herzklopfen gerade.", drama: "Für alles, was gerade kompliziert ist.", empower: "Für dich und nur dich.", sad: "Darf auch mal wehtun." };
  const opts = [s.e >= .8 ? "Bringt dich auf die Tanzfläche." : s.e <= .4 ? "Zum Runterkommen." : "Mitsingen ausdrücklich erlaubt.", "Lauter drehen erlaubt."];
  if (s.m === S.a.heart) opts.push(heartLine[s.m], heartLine[s.m]);
  const tail = opts[Math.floor(hash(s.t) * opts.length) % opts.length];
  const age = s.y - S.a.year;
  if (s.side === "now") return `Läuft ${s.y >= THIS_YEAR - 1 ? "gerade" : "seit " + s.y} überall. ${tail}`;
  if (age >= 8 && age <= 30) return `${s.y} warst du ${age}. ${tail}`;
  return `Ein Klassiker aus ${s.y}. ${tail}`;
}
function trackNo(i) {
  const sideA = S.songs.filter(s => s.side === "then").length;
  return i < sideA ? "A" + (i + 1) : "B" + (i - sideA + 1);
}

// JSONP works even where the API sends no CORS headers; fetch is only the first try.
function jsonp(url) {

  bg.querySelector("#vclose").onclick = close;
  bg.querySelector("#vshare").onclick = async () => {
    const file = new File([blob], `soundtrack-of-my-heart.${ext}`, { type: blob.type });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Soundtrack of My Heart" }); return; } } catch (e) { if (e.name === "AbortError") return; }
    toast("Halte das Video gedrückt oder nutze „Als Datei laden“.");
  };
}

// ---------- Legal (placeholder texts, must be replaced before launch) ----------
function openLegal() {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lt"><h2 id="lt" style="font-size:26px">Datenschutz</h2>
    <p>Deine Fotos, dein Geburtsjahr und deine Antworten werden nur in deinem Browser verarbeitet. Es gibt kein Konto, keine Cookies und kein Tracking. Nichts wird an einen Server gesendet.</p>
    <p>Das Video entsteht auf deinem Gerät. Wenn du es teilst, gelten die Regeln von Instagram oder TikTok.</p>
    <p class="why-box"><b>Hinweis zum Prototyp:</b> Impressum und die endgültige Datenschutzerklärung fehlen noch und müssen vor dem Start mit Name und Anschrift der Anbieterin ergänzt werden.</p>
    <button class="btn ghost" id="lclose">Schließen</button></div>`;
  document.body.appendChild(bg);
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  bg.querySelector("#lclose").onclick = () => bg.remove();
}

// ---------- Share sheet ----------
function tracklist() { return "Mein Soundtrack of My Heart\n" + S.songs.map((s, i) => `${trackNo(i)}  ${s.t}${s.a ? " – " + s.a : ""}${s.y ? " (" + s.y + ")" : ""}`).join("\n"); }
function openShare() {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sht">
    <h2 id="sht" style="font-size:26px">So teilst du dein Reel</h2>
    <ol>
      <li>Video speichern. Im Prototyp geht das noch nicht, in der App ist es ein Tipp.</li>
      <li>In Instagram oder TikTok als Reel hochladen.</li>
      <li>Auf „Musik hinzufügen" tippen und deine Songs aus der Liste unten suchen. Bei Instagram passen mehrere Songs in ein Reel.</li>
    </ol>
    <pre id="tl">${esc(tracklist())}</pre>
    <button class="btn" id="copy">Songliste kopieren</button>
    <div class="why-box"><b>Warum die Musik erst beim Teilen dazukommt:</b> Instagram und TikTok haben Lizenzen für ihre Musikbibliothek. Legst du die Songs dort drüber, bleibt dein Reel online und wird nicht stummgeschaltet.</div>
    <button class="btn ghost" id="close">Schließen</button>
  </div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector("#close").onclick = close;
  bg.querySelector("#copy").onclick = () => {
    const done = () => toast("Songliste kopiert.");
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(bg.querySelector("#tl")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Markiert. Jetzt kopieren."); };
    try { navigator.clipboard.writeText(tracklist()).then(done, fallback); } catch (e) { fallback(); }
  };
  bg.querySelector("#copy").focus();
}

$("#back").onclick = () => {
  if (S.screen === "quiz") { if (S.q > 0) S.q--; else S.screen = "start"; }
  else if (S.screen === "songs") { S.screen = "quiz"; S.q = Q.length - 1; }
  else if (S.screen === "photos") S.screen = "songs";
  else if (S.screen === "reel") S.screen = "photos";
  render();
};
render();
</script>
